<!DOCTYPE html>
<html data-app-theme="light" lang="ko" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="万佳生产数据管理平台 - 생산 기록, 통계, 현황 관리" />
    <meta name="theme-color" content="#F3F5F7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      (function(){
        var mode = 'light';
        var field = /^\/field(?:\/|$)/.test(location.pathname);
        var injectionBoard = /^\/(?:boards\/injection|(?:next\/)?production\/injection-board)(?:\/|$)/.test(location.pathname);
        try {
          mode = localStorage.getItem('wj:appearance:v1') === 'dark' ? 'dark' : 'light';
          // Cosmetic hint only: valid solely for the same auth generation.
          var session = null;
          try { session = JSON.parse(localStorage.getItem('wj-auth-session-control-v2') || 'null'); } catch (ignored) { /* Invalid auth storage is handled by auth, not appearance. */ }
          var fieldSession = localStorage.getItem('wj:appearance:field-session:v1');
          field = field || Boolean(session && session.id && fieldSession === session.id);
          if (localStorage.getItem('lite') === '1') {
            document.documentElement.classList.add('lite-mode');
            mode = 'light';
          }
        } catch (error) {
          // Storage can be disabled on managed kiosk browsers. Normal CSS must
          // still load; never disable Vite's route styles as a fallback.
        }
        if (field) {
          mode = 'light';
          document.documentElement.setAttribute('data-field-appearance', 'legacy');
        }
        if (injectionBoard) {
          mode = 'light';
          document.documentElement.setAttribute('data-injection-board-appearance', 'legacy');
        }
        document.documentElement.setAttribute('data-app-theme', mode);
        document.documentElement.style.colorScheme = mode;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', mode === 'dark' ? '#101619' : '#F3F5F7');
      })();
    </script>
    <title>万佳生产数据管理平台</title>
  </head>
  <body class="min-h-screen bg-gray-50 antialiased selection:bg-[var(--wj-accent-soft)] selection:text-[var(--wj-text)]">
    <noscript>이 애플리케이션은 JavaScript가 필요합니다.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
