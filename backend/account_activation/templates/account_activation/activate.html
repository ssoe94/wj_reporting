<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WJ 최초 비밀번호 설정</title><link rel="stylesheet" href="{% url 'activation-activation.css' %}">
<script src="{% url 'activation-activate.js' %}" defer></script></head>
<body><main><h1>최초 비밀번호 설정</h1>
<p>본인 계정의 비밀번호를 직접 설정하세요. 링크는 발급 후 15분 동안 한 번만 사용할 수 있습니다.</p>
<form id="activation-form" method="post" autocomplete="off" hidden>{% csrf_token %}
<label for="password">새 비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
<label for="confirmation">새 비밀번호 확인</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
<p>8자 이상으로 설정하고 이름·아이디, 흔한 비밀번호, 숫자만 있는 비밀번호는 피하세요.</p>
<button type="submit">비밀번호 설정 및 계정 활성화</button></form>
<p id="status" role="status" aria-live="polite">링크를 확인하고 있습니다.</p>
<noscript>보안을 위해 JavaScript를 사용할 수 있는 브라우저에서 링크를 여세요.</noscript>
<p id="done" hidden>활성화가 완료되었습니다. 이 화면을 닫고 기존 WJ 로그인 화면에서 직접 로그인하세요.</p>
</main></body></html>
