name: Test and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Run validation only or deploy the selected branch
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - test-only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint legacy frontend
        run: npm --prefix frontend run lint

      - name: Validate analytical state and scope contracts
        run: node --experimental-strip-types --test frontend/tests/*.test.ts

      - name: Build production frontend bundle
        run: npm --prefix frontend run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          INTERNAL_DATABASE_URL: ""
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: synthetic-ci-validation-only-not-a-deployment-secret
          DEBUG: "False"
          ENVIRONMENT: test
          MES_USER_OAUTH_ENABLED: "False"
          ACCOUNT_ACTIVATION_ENABLED: "True"
        run: |
          test ! -e .env && test ! -e ../.env
          python manage.py test --no-input

      - name: Validate isolated OAuth and existing authentication contracts
        run: |
          python scripts/test_mes_oauth_postgres_local.py
          python scripts/check-mes-oauth.py
          python scripts/check-mes-oauth.py \
            quality.test_archive_service \
            injection.test_admin_user_create.MissingUserProfileAuthenticationTests \
            injection.test_admin_user_create.FirstLoginPasswordChangeTests \
            injection.test_admin_user_create.AdminUserStatusTests
          python scripts/check-mes-oauth.py \
            quality.test_inspection_migration \
            quality.test_inspection_flow_scenarios \
            quality.test_inspection_beta_access \
            quality.test_inspection_roles \
            quality.test_inspection_role_api \
            quality.test_inspection_role_migration \
            quality.test_inspection_role_security \
            quality.test_inspection_live_adapter \
            quality.test_inspection_live_readback \
            quality.test_inspection_board_repository \
            quality.test_inspection_integration_trial \
            quality.test_inspection_integration_trial_board \
            quality.test_inspection_trial_detail

      - name: Validate PostgreSQL OAuth replay and migration contracts
        run: |
          if ! command -v pg_config >/dev/null 2>&1; then
            echo "::error::Installed PostgreSQL tools are required for OAuth validation."
            exit 1
          fi
          postgres_bin="$(pg_config --bindir)"
          python scripts/check-mes-oauth-postgres-local.py \
            --postgres-bin="$postgres_bin" --fixture-name=pg-ci \
            mes_oauth account_activation quality.test_inspection_live_adapter \
            quality.test_inspection_live_readback quality.test_inspection_board_repository \
            quality.test_inspection_integration_trial quality.test_inspection_integration_trial_board \
            quality.test_inspection_trial_detail production.test_mes_execution_contract \
            production.test_mes_delivery_transport production.test_mes_delivery \
            production.test_mes_delivery_credentials production.test_mes_delivery_views \
            production.test_mes_delivery_postgres production.test_mes_delivery_read_contract \
            production.test_mes_read_status

      - name: Validate isolated PostgreSQL inspection contracts
        run: |
          python scripts/test_inspection_postgres_local.py
          if ! command -v pg_config >/dev/null 2>&1; then
            echo "::error::Installed PostgreSQL tools are required for inspection validation."
            exit 1
          fi
          postgres_bin="$(pg_config --bindir)"
          python scripts/check-inspection-postgres-local.py \
            --postgres-bin="$postgres_bin" --fixture-name=pg-ins

      - name: Run local AI worker tests
        run: >-
          python -m unittest
          local_worker.test_worker
          local_worker.test_grounding_regressions
          local_worker.test_quality_daily_attention
          local_worker.test_quality_report_taxonomy_audit
          local_worker.test_claude_bridge
          local_worker.test_chatgpt_bridge
          local_worker.test_worker_launcher

  deploy-main:
    name: Deploy production from main
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate production deploy hooks
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_BACKEND" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_BACKEND is not configured."
            exit 1
          fi
          if [ -z "$RENDER_DEPLOY_HOOK_FRONTEND" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_FRONTEND is not configured."
            exit 1
          fi

      - name: Deploy production backend
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BACKEND"

      - name: Wait for backend health
        run: bash scripts/wait-health.sh https://wj-reporting-backend.onrender.com/api/health/ 300

      - name: Wait for production AI worker API
        run: |
          end=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              https://wj-reporting-backend.onrender.com/api/ai/worker/status/ || true)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "Production AI worker API is available (HTTP $code)."
              exit 0
            fi
            echo "Waiting for production AI worker API (HTTP $code)..."
            sleep 5
          done
          echo "::error::Production AI worker API did not become available."
          exit 1

      - name: Deploy production frontend
        env:
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_FRONTEND"

  verify-main:
    name: Verify production deployment
    needs: deploy-main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Wait for the production commit
        env:
          SITE_URL: https://wj-reporting.onrender.com
          EXPECTED_BRANCH: main
        run: bash scripts/wait-static-commit.sh "$SITE_URL" "$GITHUB_SHA" "$EXPECTED_BRANCH" 300

      - name: Run production smoke tests
        run: bash scripts/quick-smoke-test.sh
